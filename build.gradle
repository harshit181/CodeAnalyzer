plugins {
    id 'java'
    id 'application'
}

group 'com.codeanalyzer'
version '1.0-SNAPSHOT'

sourceCompatibility = 17
targetCompatibility = 17

repositories {
    mavenCentral()
}

dependencies {
    // JavaParser for code analysis
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.24.2'
    
    // Apache Commons CLI for command-line interface
    implementation 'commons-cli:commons-cli:1.5.0'
    
    // Apache Commons Lang for utilities
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    
    // Logging with SLF4J
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.slf4j:slf4j-simple:1.7.36'
    
    // JUnit for testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}

application {
    mainClass = 'com.codeanalyzer.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.codeanalyzer.Main'
    }
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnitPlatform()
}
